name: CI

on:
  push:
  pull_request:

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: swift test
        working-directory: Packages/CloudHubCore
        run: swift test

  ios:
    name: Build the app (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen
      - name: Core tests (macOS)
        working-directory: Packages/CloudHubCore
        run: swift test
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project CloudHub.xcodeproj -scheme CloudHub \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
