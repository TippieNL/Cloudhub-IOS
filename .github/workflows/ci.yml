name: CI

on:
  push:
  pull_request:

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"
      - name: swift test
        working-directory: Packages/CloudHubCore
        run: swift test

  ios:
    name: Build the app (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen
      - name: Core tests (macOS)
        working-directory: Packages/CloudHubCore
        run: swift test
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project CloudHub.xcodeproj -scheme CloudHub \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO -parallelizeTargets | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

  ipa:
    name: Unsigned .ipa (for sideloading)
    runs-on: macos-15
    needs: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen
      - name: Archive for devices, unsigned
        run: |
          set -o pipefail
          xcodebuild archive \
            -project CloudHub.xcodeproj -scheme CloudHub -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/CloudHub.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -20
      - name: Package the .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/CloudHub.xcarchive/Products/Applications/CloudHub.app build/Payload/
          cd build && zip -qry CloudHub-unsigned.ipa Payload
          ls -la CloudHub-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: CloudHub-unsigned-ipa
          path: build/CloudHub-unsigned.ipa
          retention-days: 90
