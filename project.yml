# The Xcode project is generated from this file, so it never needs merging:
#
#     brew install xcodegen
#     xcodegen            # writes CloudHub.xcodeproj
#
# Then open CloudHub.xcodeproj, pick your team under Signing & Capabilities,
# and run. The bundle id can be changed below or in Xcode.
name: CloudHub
options:
  bundleIdPrefix: nl.tippie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "4.7"
    CURRENT_PROJECT_VERSION: "29"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  CloudHubCore:
    path: Packages/CloudHubCore

targets:
  CloudHub:
    type: application
    platform: iOS
    sources:
      - path: CloudHub
    dependencies:
      - package: CloudHubCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.tippie.cloudhub
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CloudHub/Resources/Info.plist
    info:
      path: CloudHub/Resources/Info.plist
      properties:
        CFBundleDisplayName: CloudHub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Self-hosted servers: plain http on a home network, and certificates
        # the device does not trust (which the app pins by fingerprint after
        # asking). Arbitrary loads is what lets the app make that decision
        # itself rather than refusing before it is asked.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: CloudHub connects to your own server, which may be on this network.
        NSCameraUsageDescription: Take a photo or record a video to upload to your CloudHub server.
        NSMicrophoneUsageDescription: Record sound with videos you upload to your CloudHub server.
        NSPhotoLibraryAddUsageDescription: Save photos and videos from your CloudHub server to your library.
        # Downloads land in Documents, which the Files app shows under
        # On My iPhone > CloudHub.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Any file can be sent to CloudHub from another app's share sheet.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.item
              - public.data
              - public.content
        UIBackgroundModes:
          - processing
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - nl.tippie.cloudhub.uploads
        ITSAppUsesNonExemptEncryption: false

  CloudHubCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Packages/CloudHubCore/Tests/CloudHubCoreTests
    dependencies:
      - package: CloudHubCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: nl.tippie.cloudhub.coretests

schemes:
  CloudHub:
    build:
      targets:
        CloudHub: all
    test:
      targets:
        - CloudHubCoreTests
